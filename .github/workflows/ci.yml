name: Laravel CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    # Spin up an isolated MySQL service container inside GitHub's network
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: laravel_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP Environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4' # Matches your local Docker PHP version
        extensions: mbstring, dom, curl, libxml, mysql, pdo_mysql, bcmath, json, gd
        coverage: none

    - name: Copy Testing Environment File
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Application Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate Application Encryption Key
      run: php artisan key:generate

    - name: Configure Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Run Application Migrations & Automated Tests
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: laravel_testing
        DB_USERNAME: root
        DB_PASSWORD: ""
      run: |
        php artisan migrate --force
        php artisan test
